name: Build desktop game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and export desktop builds
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap source files on first run
        shell: pwsh
        run: |
          if (-not (Test-Path "project.godot")) {
            $parts = Get-ChildItem ".bootstrap" -Filter "part*.b64" | Sort-Object Name
            if ($parts.Count -ne 6) {
              throw "Expected six project bootstrap parts; found $($parts.Count)."
            }

            $encoded = [System.Text.StringBuilder]::new()
            foreach ($part in $parts) {
              [void]$encoded.Append((Get-Content -LiteralPath $part.FullName -Raw).Trim())
            }

            $archivePath = Join-Path $env:RUNNER_TEMP "civiterra-source.zip"
            [System.IO.File]::WriteAllBytes($archivePath, [Convert]::FromBase64String($encoded.ToString()))
            $unpackPath = Join-Path $env:RUNNER_TEMP "civiterra-source"
            Expand-Archive -LiteralPath $archivePath -DestinationPath $unpackPath -Force

            $sourcePath = Join-Path $unpackPath "CivitasGodSandbox"
            if (-not (Test-Path (Join-Path $sourcePath "project.godot"))) {
              throw "The extracted Godot project is missing project.godot."
            }

            Get-ChildItem -LiteralPath $sourcePath -Force | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
            }
            Remove-Item -LiteralPath ".bootstrap" -Recurse -Force

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add Civiterra Godot source project [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit extracted source files." }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Could not push extracted source files to GitHub." }
          }

      - name: Set up Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
          cache: false

      - name: Resolve Godot console executable
        shell: pwsh
        run: |
          $godotConsole = Join-Path "$env:USERPROFILE\godot" "Godot_v4.3-stable_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godotConsole)) {
            throw "Godot executable was not installed at $godotConsole."
          }
          "GODOT_EXE=$godotConsole" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show Godot version
        shell: pwsh
        run: |
          & $env:GODOT_EXE --version
          if ($LASTEXITCODE -ne 0) { throw "Could not run Godot." }

      - name: Import project and check scripts
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path . --quit *> "godot-validation.log"
          $validationExitCode = $LASTEXITCODE
          Get-Content "godot-validation.log"
          if ($validationExitCode -ne 0) { throw "Godot project import failed with exit code $validationExitCode." }
          if (Select-String -Path "godot-validation.log" -Pattern "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" -Quiet) {
            throw "Godot reported a script or project error during validation."
          }

      - name: Smoke-test main scene
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path . --quit-after 3 *> "godot-smoke-test.log"
          $smokeExitCode = $LASTEXITCODE
          Get-Content "godot-smoke-test.log"
          if ($smokeExitCode -ne 0) { throw "Main scene smoke test failed with exit code $smokeExitCode." }
          $startupErrors = Select-String -Path "godot-smoke-test.log" -Pattern "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" | Where-Object { $_.Line -notmatch 'ERROR: Parameter "m" is null\.' }
          if ($startupErrors) {
            $startupErrors | ForEach-Object { Write-Error $_.Line }
            throw "Godot reported a script or scene error during startup."
          }

      - name: Save/load regression test
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path . -- --civiterra-save-load-smoke-test *> "godot-save-load-test.log"
          $saveLoadExitCode = $LASTEXITCODE
          Get-Content "godot-save-load-test.log"
          if ($saveLoadExitCode -ne 0) { throw "Save/load regression test failed with exit code $saveLoadExitCode." }
          if (-not (Select-String -Path "godot-save-load-test.log" -Pattern "CIVITERRA_SAVE_LOAD_TEST_PASSED" -Quiet)) {
            throw "Save/load regression test did not report success."
          }
          $saveLoadErrors = Select-String -Path "godot-save-load-test.log" -Pattern "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" | Where-Object { $_.Line -notmatch 'ERROR: Parameter "m" is null\.' }
          if ($saveLoadErrors) {
            $saveLoadErrors | ForEach-Object { Write-Error $_.Line }
            throw "Godot reported an error during save/load regression testing."
          }

      - name: Export Windows and Linux
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & $env:GODOT_EXE --headless --verbose --path . --export-release "Windows Desktop" "dist/Civiterra.exe" *> "dist/export-windows.log"
          $windowsExitCode = $LASTEXITCODE
          Get-Content "dist/export-windows.log"
          if ($windowsExitCode -ne 0) { throw "Windows export failed with exit code $windowsExitCode." }
          & $env:GODOT_EXE --headless --verbose --path . --export-release "Linux/X11" "dist/Civiterra.x86_64" *> "dist/export-linux.log"
          $linuxExitCode = $LASTEXITCODE
          Get-Content "dist/export-linux.log"
          if ($linuxExitCode -ne 0) { throw "Linux export failed with exit code $linuxExitCode." }

      - name: Generate SHA-256 checksums for desktop builds
        shell: pwsh
        run: |
          $lines = foreach ($path in @("dist/Civiterra.exe", "dist/Civiterra.x86_64")) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $path -Leaf)"
          }
          Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Value $lines -Encoding ascii

      - name: Upload Godot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Civiterra-godot-diagnostics
          path: |
            godot-validation.log
            godot-smoke-test.log
            godot-save-load-test.log
            dist/export-windows.log
            dist/export-linux.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: Civiterra-desktop-builds
          path: |
            dist/Civiterra.exe
            dist/Civiterra.x86_64
          if-no-files-found: error
          retention-days: 30

      # Action artifacts are downloaded as ZIPs by GitHub. Publish the actual
      # executable files as individual release assets so users don't need that
      # archive wrapper, and attach checksums for independent verification.
      - name: Update rolling direct-download tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f civiterra-latest "$env:GITHUB_SHA"
          git push origin --force refs/tags/civiterra-latest:refs/tags/civiterra-latest
          if ($LASTEXITCODE -ne 0) { throw "Could not update the rolling release tag." }

      - name: Publish direct desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: civiterra-latest
          name: Civiterra Latest Build
          body: |
            Latest automated desktop builds from the Civiterra main branch.

            Download Civiterra.exe or Civiterra.x86_64 directly without the GitHub Actions ZIP wrapper. SHA256SUMS.txt contains hashes for verification.

            These are currently unsigned development builds. A browser or Windows SmartScreen may still warn about a new executable; a workflow cannot establish publisher reputation or substitute for a code-signing certificate.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Civiterra.exe
            dist/Civiterra.x86_64
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
