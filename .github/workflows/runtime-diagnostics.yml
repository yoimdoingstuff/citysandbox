name: Runtime stress tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: civiterra-runtime-stress-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-and-capture:
    name: Launch Civiterra and profile runtime stress scenarios
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Launch rendered game and capture FPS plus process telemetry
        id: diagnostic
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          $stdoutPath = Join-Path $PWD "logs/runtime-stresstests.stdout.log"
          $stderrPath = Join-Path $PWD "logs/runtime-stresstests.stderr.log"
          $monitorPath = Join-Path $PWD "logs/runtime-stresstests.monitor.log"
          $summaryPath = Join-Path $PWD "logs/runtime-stresstests-summary.txt"
          $combinedPath = Join-Path $PWD "logs/runtime-stresstests.log"
          $godotConsole = Join-Path "$env:USERPROFILE\godot" "Godot_v4.3-stable_win64_console.exe"
          $startedAt = Get-Date
          $timedOut = $false
          $exitCode = "not-started"
          $runSeconds = 0.0
          $suiteCompleted = $false
          $scenarioCount = 0
          $fpsSampleCount = 0

          "Civiterra runtime stress-test monitor" | Set-Content -LiteralPath $monitorPath
          "Run ID: $env:GITHUB_RUN_ID / attempt $env:GITHUB_RUN_ATTEMPT" | Add-Content -LiteralPath $monitorPath
          "Commit: $env:GITHUB_SHA" | Add-Content -LiteralPath $monitorPath
          "Sample time (s) | CPU time (s) | Working set (MB) | Private memory (MB)" | Add-Content -LiteralPath $monitorPath

          try {
            if (-not (Test-Path -LiteralPath $godotConsole)) {
              throw "Godot console executable was not found at $godotConsole"
            }

            $godotVersion = (& $godotConsole --version 2>&1 | Out-String).Trim()
            $osDescription = (Get-CimInstance Win32_OperatingSystem).Caption
            $cpuDescription = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
            $memoryGb = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)

            $process = Start-Process -FilePath $godotConsole -ArgumentList @("--path", ".", "--rendering-method", "gl_compatibility", "--rendering-driver", "opengl3", "--", "--civiterra-runtime-stress-tests") -WorkingDirectory $PWD -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru

            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            $nextSample = 0
            while ($timer.Elapsed.TotalSeconds -lt 180) {
              $process.Refresh()
              if ($process.HasExited) {
                break
              }

              if ($timer.Elapsed.TotalSeconds -ge $nextSample) {
                $cpu = [math]::Round($process.TotalProcessorTime.TotalSeconds, 2)
                $workingSet = [math]::Round($process.WorkingSet64 / 1MB, 1)
                $privateMemory = [math]::Round($process.PrivateMemorySize64 / 1MB, 1)
                "{0,6:N1} | {1,8:N2} | {2,14:N1} | {3,16:N1}" -f $timer.Elapsed.TotalSeconds, $cpu, $workingSet, $privateMemory |
                  Add-Content -LiteralPath $monitorPath
                $nextSample += 2
              }
              Start-Sleep -Seconds 1
            }

            $runSeconds = [math]::Round($timer.Elapsed.TotalSeconds, 2)
            $process.Refresh()
            if (-not $process.HasExited) {
              $timedOut = $true
              Stop-Process -Id $process.Id -Force
              Start-Sleep -Milliseconds 500
              $exitCode = "terminated-after-120-second-observation"
            } else {
              $exitCode = $process.ExitCode
            }
            if (Test-Path -LiteralPath $stdoutPath) {
              $suiteCompleted = [bool](Select-String -LiteralPath $stdoutPath -SimpleMatch "STRESS_SUITE_END|status=completed" -Quiet)
              $scenarioCount = @(Select-String -LiteralPath $stdoutPath -Pattern "STRESS_SCENARIO_COMPLETE\|" -ErrorAction SilentlyContinue).Count
            }

            @(
              "Civiterra Runtime Stress Tests",
              "UTC start: $($startedAt.ToUniversalTime().ToString('o'))",
              "UTC finish: $((Get-Date).ToUniversalTime().ToString('o'))",
              "Run ID: $env:GITHUB_RUN_ID",
              "Attempt: $env:GITHUB_RUN_ATTEMPT",
              "Commit: $env:GITHUB_SHA",
              "Branch/ref: $env:GITHUB_REF",
              "Godot version: $godotVersion",
              "OS: $osDescription",
              "CPU: $cpuDescription",
              "Installed RAM: $memoryGb GB",
              "Observed runtime: $runSeconds seconds",
              "Timed out: $timedOut",
              "Game process exit code: $exitCode",
              "Stress suite completed: $suiteCompleted",
              "Completed scenarios: $scenarioCount",
              "Interpretation: engine FPS, frame interval percentiles, maximum frame work, stress action duration, entity counts and process CPU/memory are measured separately."
            ) | Set-Content -LiteralPath $summaryPath
          }
          catch {
            $runSeconds = [math]::Round(((Get-Date) - $startedAt).TotalSeconds, 2)
            @(
              "Civiterra runtime diagnostic FAILED",
              "UTC start: $($startedAt.ToUniversalTime().ToString('o'))",
              "UTC finish: $((Get-Date).ToUniversalTime().ToString('o'))",
              "Run ID: $env:GITHUB_RUN_ID",
              "Commit: $env:GITHUB_SHA",
              "Observed runtime: $runSeconds seconds",
              "Error: $($_.Exception.Message)"
            ) | Set-Content -LiteralPath $summaryPath
            $_ | Out-String | Add-Content -LiteralPath $stderrPath
            Write-Error $_
          }
          finally {
            # Godot writes detailed hitch samples to user:// so preserve that
            # file beside its console output before committing/uploading the logs.
            $appDataRoot = Join-Path $env:APPDATA "Godot\app_userdata"
            if (Test-Path -LiteralPath $appDataRoot) {
              $perfLog = Get-ChildItem -LiteralPath $appDataRoot -Filter "civiterra-performance.log" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($perfLog) {
                Copy-Item -LiteralPath $perfLog.FullName -Destination (Join-Path $PWD "logs/runtime-stresstests.performance.log") -Force
              }
              $stressCsv = Get-ChildItem -LiteralPath $appDataRoot -Filter "civiterra-stresstests.csv" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($stressCsv) {
                Copy-Item -LiteralPath $stressCsv.FullName -Destination (Join-Path $PWD "logs/runtime-stresstests.csv") -Force
              }
              # Screenshots are saved under user:// by Godot. Copy every scenario
              # image into this run's artifact and retain one rolling preview in git.
              $screenshotDir = Get-ChildItem -LiteralPath $appDataRoot -Directory -Filter "civiterra-screenshots" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($screenshotDir) {
                # Keep the published artifact capped at ten checkpoints, ordered
                # by milestone name so the first and last samples span the run.
                $screenshotFiles = @(Get-ChildItem -LiteralPath $screenshotDir.FullName -Filter "*.png" -File -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -First 10)
                if ($screenshotFiles.Count -gt 0) {
                  $screenshotOutputDir = Join-Path $PWD "logs/runtime-stresstests-screenshots"
                  New-Item -ItemType Directory -Force -Path $screenshotOutputDir | Out-Null
                  $screenshotFiles | Copy-Item -Destination $screenshotOutputDir -Force
                  $latestScreenshot = $screenshotFiles | Sort-Object Name | Select-Object -Last 1
                  Copy-Item -LiteralPath $latestScreenshot.FullName -Destination (Join-Path $PWD "logs/civiterra-latest.png") -Force
                  Add-Content -LiteralPath $summaryPath -Value "Rendered screenshots captured: $($screenshotFiles.Count)"
                  Add-Content -LiteralPath $summaryPath -Value "Latest screenshot: logs/civiterra-latest.png"
                } else {
                  Add-Content -LiteralPath $summaryPath -Value "Rendered screenshots captured: 0 (screenshot folder was empty)"
                }
              } else {
                Add-Content -LiteralPath $summaryPath -Value "Rendered screenshots captured: 0 (Godot screenshot folder not found)"
              }
            }
            if (Test-Path -LiteralPath (Join-Path $PWD "logs/runtime-stresstests.csv")) {
              try {
                $stressRows = @(Import-Csv -LiteralPath (Join-Path $PWD "logs/runtime-stresstests.csv"))
                $fpsSampleCount = @($stressRows | Where-Object { $_.record_type -eq "sample" }).Count
                Add-Content -LiteralPath $summaryPath -Value "One-second FPS sample windows: $fpsSampleCount"
              } catch {
                "CSV parse error: $($_.Exception.Message)" | Add-Content -LiteralPath $stderrPath
              }
            }
            $combined = @(
              "===== SUMMARY =====",
              (Get-Content -LiteralPath $summaryPath -Raw -ErrorAction SilentlyContinue),
              "",
              "===== GODOT STDOUT =====",
              (Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue),
              "",
              "===== GODOT STDERR =====",
              (Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue),
              "",
              "===== PROCESS MONITOR =====",
              (Get-Content -LiteralPath $monitorPath -Raw -ErrorAction SilentlyContinue),
              "",
              "===== FRAME HITCH / SLOW OPERATION SAMPLES =====",
              (Get-Content -LiteralPath (Join-Path $PWD "logs/runtime-stresstests.performance.log") -Raw -ErrorAction SilentlyContinue),
              "",
              "===== FRAME RATE CSV =====",
              (Get-Content -LiteralPath (Join-Path $PWD "logs/runtime-stresstests.csv") -Raw -ErrorAction SilentlyContinue)
            )
            $combined | Set-Content -LiteralPath $combinedPath
            Write-Output (Get-Content -LiteralPath $summaryPath -Raw -ErrorAction SilentlyContinue)
          }

      - name: Upload per-run performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Civiterra-runtime-stresstests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/runtime-stresstests*
            logs/runtime-stresstests-screenshots/**
            logs/civiterra-latest.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish per-run results to the rolling logs folder
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          if (-not (Test-Path -LiteralPath "logs/runtime-stresstests.log")) {
            "No runtime log was produced. Check the setup/run step in the Actions job." |
              Set-Content -LiteralPath "logs/runtime-stresstests.log"
          }

          # Keep this run's samples separate from the checked-out branch. The
          # rolling logs may be changed by another workflow while this test runs.
          $snapshot = Join-Path $env:RUNNER_TEMP "civiterra-log-snapshot"
          if (Test-Path -LiteralPath $snapshot) {
            Remove-Item -LiteralPath $snapshot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $snapshot | Out-Null
          Get-ChildItem -LiteralPath "logs" -Filter "runtime-stresstests*" -File |
            Copy-Item -Destination $snapshot -Force
          if (Test-Path -LiteralPath "logs/civiterra-latest.png") {
            Copy-Item -LiteralPath "logs/civiterra-latest.png" -Destination $snapshot -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A reset avoids rebase conflicts when two runs update the same rolling
          # logs. Reapply the saved snapshot to the newest source branch each try.
          $pushed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git fetch origin "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds $attempt
              continue
            }
            git reset --hard "origin/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to the latest branch head." }

            New-Item -ItemType Directory -Force -Path "logs" | Out-Null
            Get-ChildItem -LiteralPath $snapshot -File |
              Copy-Item -Destination "logs" -Force
            # Stage rolling text/CSV logs only. The per-scenario screenshot
            # directory is uploaded as an Actions artifact, not committed wholesale.
            Get-ChildItem -LiteralPath "logs" -Filter "runtime-stresstests*" -File |
              ForEach-Object { git add $_.FullName }
            if (Test-Path -LiteralPath "logs/civiterra-latest.png") {
              git add "logs/civiterra-latest.png"
            }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Output "The latest diagnostic logs already match the repository."
              $pushed = $true
              break
            }

            git commit -m "Update Civiterra runtime stress-test results [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit runtime diagnostic logs." }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            Write-Warning "Log push attempt $attempt raced a newer commit; retrying on the newest branch."
            Start-Sleep -Seconds $attempt
          }

          if (-not $pushed) {
            throw "Could not publish runtime logs after four attempts. The artifact was uploaded separately."
          }

      - name: Validate stress suite completion and FPS telemetry
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "logs/runtime-stresstests-summary.txt"
          $stdoutPath = "logs/runtime-stresstests.stdout.log"
          $stderrPath = "logs/runtime-stresstests.stderr.log"
          $csvPath = "logs/runtime-stresstests.csv"
          $sourcePath = "main.gd"
          if (-not (Test-Path -LiteralPath $sourcePath)) { throw "The main game script is missing." }
          $source = Get-Content -LiteralPath $sourcePath -Raw
          if ($source -notmatch 'const AIRPORT_INTRODUCTION_YEAR: int = 1945' -or
              $source -notmatch 'const MARITIME_INTRODUCTION_YEAR: int = AIRPORT_INTRODUCTION_YEAR - 60') {
            throw "Transport era regression: maritime availability must begin 60 years before the airport milestone."
          }
          if ($source -notmatch 'func _create_airport_access_road\(' -or
              $source -notmatch 'traffic_light_records_by_city\.get\(city_id') {
            throw "Airport road connection or city-local traffic-light optimization is missing."
          }
          if ($source -notmatch 'construction_site_indices\.get\(requested_site_id' -or
              $source -notmatch 'rubble_index_by_id\.get\(rubble_id') {
            throw "Construction-site or rubble ID-index optimization is missing."
          }
          if ($source -notmatch 'airport_render_range_squared' -or
              $source -notmatch '_spawn_transport\(first_airport_city, first_airport_city, "air"\)') {
            throw "Aircraft visibility or first-airport flight fallback is missing."
          }
          if (-not (Test-Path -LiteralPath $summaryPath)) { throw "The stress-test summary is missing." }
          $summary = Get-Content -LiteralPath $summaryPath -Raw
          if ($summary -notmatch "Stress suite completed: True") { throw "The game did not report a completed stress suite. Check the uploaded logs." }
          if ($summary -match "Timed out: True") { throw "The game exceeded the stress-test timeout." }
          if ($summary -notmatch "Game process exit code: 0") { throw "The game did not exit successfully." }
          if (-not (Test-Path -LiteralPath $stdoutPath)) { throw "The game's standard output log is missing." }
          $scriptErrors = @()
          $logPaths = @($stdoutPath, $stderrPath) | Where-Object { Test-Path -LiteralPath $_ }
          if ($logPaths.Count -gt 0) {
            $scriptErrors = @(Select-String -LiteralPath $logPaths -Pattern "SCRIPT ERROR:|SCRIPT WARNING:|Parse Error:|Failed to load script" -ErrorAction SilentlyContinue)
          }
          if ($scriptErrors.Count -gt 0) {
            $examples = ($scriptErrors | Select-Object -First 5 | ForEach-Object { $_.Line }) -join "; "
            throw "Godot reported $($scriptErrors.Count) script error/warning line(s): $examples"
          }
          $scenarioCount = @(Select-String -LiteralPath $stdoutPath -Pattern "STRESS_SCENARIO_COMPLETE\|" -ErrorAction SilentlyContinue).Count
          if ($scenarioCount -lt 15) { throw "Expected at least 15 completed scenarios, but found $scenarioCount." }
          if (-not (Test-Path -LiteralPath $csvPath)) { throw "The FPS telemetry CSV was not generated." }
          $screenshotDirectory = "logs/runtime-stresstests-screenshots"
          if (-not (Test-Path -LiteralPath $screenshotDirectory)) { throw "The rendered screenshot directory is missing." }
          $screenshotCount = @(Get-ChildItem -LiteralPath $screenshotDirectory -Filter "*.png" -File -ErrorAction SilentlyContinue).Count
          $expectedScreenshotCount = [math]::Min(10, $scenarioCount)
          if ($screenshotCount -ne $expectedScreenshotCount) { throw "Expected $expectedScreenshotCount evenly spaced screenshots (maximum 10), but found $screenshotCount." }
          if (-not (Test-Path -LiteralPath "logs/civiterra-latest.png")) { throw "The rolling latest screenshot is missing." }
          $rows = @(Import-Csv -LiteralPath $csvPath)
          $sampleRows = @($rows | Where-Object { $_.record_type -eq "sample" })
          if ($sampleRows.Count -lt 30) { throw "Expected at least 30 one-second FPS samples, but found $($sampleRows.Count)." }
          Write-Output "Stress suite passed: $scenarioCount scenarios, $($sampleRows.Count) FPS sampling windows, and $screenshotCount rendered screenshots."
